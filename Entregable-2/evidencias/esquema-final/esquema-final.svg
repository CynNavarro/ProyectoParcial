<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .root { fill: #e8607a; }
      .lvl1 { fill: #fff0f3; stroke: #e8607a; stroke-width: 1.6; }
      .lvl2 { fill: #ffffff; stroke: #ffb3c6; stroke-width: 1.2; }
      .band { fill: none; stroke: #f3c6d2; stroke-width: 1; stroke-dasharray: 4 4; }
      .t-root { fill: #ffffff; font-size: 17px; font-weight: 700; }
      .t1 { fill: #4a1220; font-size: 14px; font-weight: 700; }
      .t1s { fill: #8a4a5c; font-size: 11px; }
      .t2 { fill: #5c2434; font-size: 11.5px; }
      .tband { fill: #b06076; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
      .line { stroke: #d98ba0; stroke-width: 1.4; fill: none; }
      .note { fill: #fff0f3; stroke: #ffb3c6; stroke-width: 1.2; }
      .tnote { fill: #6b2c3e; font-size: 12.5px; }
      .title { fill: #4a1220; font-size: 20px; font-weight: 800; }
      .chg { fill: #fdeef3; stroke: #e8607a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1000" height="920" fill="#fffafc"/>
  <text x="500" y="38" text-anchor="middle" class="title">Esquema final del sitio ASummerTenshi (asummertenshi.studio)</text>

  <!-- Raíz -->
  <rect x="420" y="58" width="160" height="46" rx="12" class="root"/>
  <text x="500" y="86" text-anchor="middle" class="t-root">Inicio (/)</text>

  <!-- Conector raíz -->
  <path class="line" d="M500 104 V132 M95 132 H795 M95 132 V160 M235 132 V160 M375 132 V160 M515 132 V160 M655 132 V160 M795 132 V160"/>

  <!-- Nivel 1 -->
  <rect x="20"  y="160" width="150" height="52" rx="10" class="lvl1"/>
  <text x="95" y="184" text-anchor="middle" class="t1">About Me</text>
  <text x="95" y="200" text-anchor="middle" class="t1s">/about</text>

  <rect x="160" y="160" width="150" height="52" rx="10" class="lvl1"/>
  <text x="235" y="184" text-anchor="middle" class="t1">Services</text>
  <text x="235" y="200" text-anchor="middle" class="t1s">/services</text>

  <rect x="300" y="160" width="150" height="52" rx="10" class="lvl1"/>
  <text x="375" y="184" text-anchor="middle" class="t1">Portfolio</text>
  <text x="375" y="200" text-anchor="middle" class="t1s">/portfolio</text>

  <rect x="440" y="160" width="150" height="52" rx="10" class="lvl1"/>
  <text x="515" y="184" text-anchor="middle" class="t1">ShowCase</text>
  <text x="515" y="200" text-anchor="middle" class="t1s">/showcase</text>

  <rect x="580" y="160" width="150" height="52" rx="10" class="lvl1"/>
  <text x="655" y="184" text-anchor="middle" class="t1">Terms of Service</text>
  <text x="655" y="200" text-anchor="middle" class="t1s">/terms</text>

  <rect x="720" y="160" width="150" height="52" rx="10" class="lvl1"/>
  <text x="795" y="184" text-anchor="middle" class="t1">Contact</text>
  <text x="795" y="200" text-anchor="middle" class="t1s">/contact</text>

  <!-- Banda Services -->
  <rect x="40" y="252" width="920" height="58" rx="10" class="band"/>
  <text x="52" y="246" class="tband">SERVICES · 5 CATEGORÍAS</text>
  <path class="line" d="M235 212 V252"/>
  <g>
    <rect x="60"  y="264" width="168" height="34" rx="8" class="lvl2"/><text x="144" y="285" text-anchor="middle" class="t2">Live 2D Rigging + Art</text>
    <rect x="244" y="264" width="168" height="34" rx="8" class="lvl2"/><text x="328" y="285" text-anchor="middle" class="t2">Vtuber Art</text>
    <rect x="428" y="264" width="168" height="34" rx="8" class="lvl2"/><text x="512" y="285" text-anchor="middle" class="t2">Rigging Services</text>
    <rect x="612" y="264" width="168" height="34" rx="8" class="lvl2"/><text x="696" y="285" text-anchor="middle" class="t2">Emotes</text>
    <rect x="796" y="264" width="148" height="34" rx="8" class="lvl2"/><text x="870" y="285" text-anchor="middle" class="t2">Illustration</text>
  </g>

  <!-- Banda Portfolio -->
  <rect x="40" y="352" width="920" height="58" rx="10" class="band"/>
  <text x="52" y="346" class="tband">PORTFOLIO · 7 OBRAS CON GALERÍA Y LIGHTBOX</text>
  <path class="line" d="M375 212 V330 M375 330 H500 M500 330 V352"/>
  <g>
    <rect x="52"  y="364" width="124" height="34" rx="8" class="lvl2"/><text x="114" y="385" text-anchor="middle" class="t2">Summer Outfits</text>
    <rect x="184" y="364" width="124" height="34" rx="8" class="lvl2"/><text x="246" y="385" text-anchor="middle" class="t2">Awa Jelly</text>
    <rect x="316" y="364" width="124" height="34" rx="8" class="lvl2"/><text x="378" y="385" text-anchor="middle" class="t2">Strawberry Art</text>
    <rect x="448" y="364" width="124" height="34" rx="8" class="lvl2"/><text x="510" y="385" text-anchor="middle" class="t2">CRK OC Style</text>
    <rect x="580" y="364" width="124" height="34" rx="8" class="lvl2"/><text x="642" y="385" text-anchor="middle" class="t2">Background</text>
    <rect x="712" y="364" width="124" height="34" rx="8" class="lvl2"/><text x="774" y="385" text-anchor="middle" class="t2">Loading Screen</text>
    <rect x="844" y="364" width="104" height="34" rx="8" class="lvl2"/><text x="896" y="385" text-anchor="middle" class="t2">Celes Vtuber</text>
  </g>

  <!-- Banda Showcase -->
  <rect x="40" y="452" width="920" height="58" rx="10" class="band"/>
  <text x="52" y="446" class="tband">SHOWCASE · DEMOSTRACIONES LIVE2D (VIDEO)</text>
  <path class="line" d="M515 212 V430 M515 430 H500 M500 430 V452"/>
  <g>
    <rect x="270" y="464" width="220" height="34" rx="8" class="lvl2"/><text x="380" y="485" text-anchor="middle" class="t2">Summer Tenshi Showcase</text>
    <rect x="510" y="464" width="220" height="34" rx="8" class="lvl2"/><text x="620" y="485" text-anchor="middle" class="t2">Loading Screen animada</text>
  </g>

  <!-- Banda Terms -->
  <rect x="40" y="552" width="920" height="58" rx="10" class="band"/>
  <text x="52" y="546" class="tband">TERMS OF SERVICE · 6 APARTADOS</text>
  <path class="line" d="M655 212 V530 M655 530 H500 M500 530 V552"/>
  <g>
    <rect x="52"  y="564" width="140" height="34" rx="8" class="lvl2"/><text x="122" y="585" text-anchor="middle" class="t2">Payments 50/50</text>
    <rect x="200" y="564" width="140" height="34" rx="8" class="lvl2"/><text x="270" y="585" text-anchor="middle" class="t2">Revisions</text>
    <rect x="348" y="564" width="140" height="34" rx="8" class="lvl2"/><text x="418" y="585" text-anchor="middle" class="t2">Live2D</text>
    <rect x="496" y="564" width="140" height="34" rx="8" class="lvl2"/><text x="566" y="585" text-anchor="middle" class="t2">Deadlines</text>
    <rect x="644" y="564" width="140" height="34" rx="8" class="lvl2"/><text x="714" y="585" text-anchor="middle" class="t2">IP Rights</text>
    <rect x="792" y="564" width="140" height="34" rx="8" class="lvl2"/><text x="862" y="585" text-anchor="middle" class="t2">Refunds</text>
  </g>

  <!-- Banda Contact -->
  <rect x="40" y="652" width="920" height="58" rx="10" class="band"/>
  <text x="52" y="646" class="tband">CONTACT · NUEVA RUTA (ENTREGABLE 2)</text>
  <path class="line" d="M795 212 V630 M795 630 H500 M500 630 V652"/>
  <g>
    <rect x="270" y="664" width="220" height="34" rx="8" class="lvl2"/><text x="380" y="685" text-anchor="middle" class="t2">Formulario de solicitud</text>
    <rect x="510" y="664" width="220" height="34" rx="8" class="lvl2"/><text x="620" y="685" text-anchor="middle" class="t2">Canales directos (5)</text>
  </g>

  <!-- Nota pie -->
  <rect x="120" y="736" width="760" height="38" rx="10" class="note"/>
  <text x="500" y="760" text-anchor="middle" class="tnote">Contacto global: pie de página con email, X, VGen, WhatsApp y teléfono en todas las rutas</text>

  <!-- Cambios respecto a actividad 1 -->
  <rect x="120" y="792" width="760" height="112" rx="12" class="chg"/>
  <text x="140" y="820" class="t1">Cambios y ajustes respecto a la planeación (actividad 1)</text>
  <g class="tnote">
    <text x="140" y="844">• Nueva ruta /contact: formulario que abre el correo prellenado y tarjetas de canales directos.</text>
    <text x="140" y="864">• Inicio con secciones proyectadas: propuesta de valor, servicios destacados, vista previa del portafolio,</text>
    <text x="140" y="882">   teaser de showcase y llamado a contacto; navegación de escritorio con enlaces persistentes y logo gráfico.</text>
  </g>
</svg>
