    - generic [ref=f31e70]:
      - heading "Welcome!" [level=3] [ref=f31e71]
      - paragraph [ref=f31e72]: I'm typeou (pronounced like typo), a Live2D rigger and crow person. caw I've been rigging regularly since mid-2021 and have rigged over 70 full-body models since then!
      - paragraph [ref=f31e73]:
        - text: I rig fully custom VTuber models with a focus on
        - mark [ref=f31e74]: expressive faces and high-range head angles
        - text: . I love rigging complex faces with
        - link "VBridger" [ref=f31e75] [cursor=pointer]:
          - /url: https://store.steampowered.com/app/1898830/VBridger/
        - text: or
        - link "Vitamins" [ref=f31e76] [cursor=pointer]:
          - /url: https://store.steampowered.com/app/2187210/Vitamins/
        - text: ", which allows for incredibly expressive faces without manual toggles!"
      - paragraph [ref=f31e77]:
        - text: I work best with artstyles similar to my model, as well as with feminine-presenting designs, but I have plenty of experience with other types of models. See my
        - link "completed rigs" [ref=f31e78] [cursor=pointer]:
          - /url: rigs.html
        - text: section for examples!
    - generic [ref=f31e80]:
      - paragraph [ref=f31e81]: Commissions operate on an application system. I require finished model art before an application can be considered, and I do not offer waitlisting or reservations at this time. An exception to these rules is made for clients who commission their model art through my partnered artist, described below.
      - paragraph [ref=f31e82]:
        - text: Please read the entire
        - link "Terms of Service" [ref=f31e83] [cursor=pointer]:
          - /url: tos.html
        - text: before contacting me or sending in an application.
