    - generic [ref=f31e224]:
      - heading "Process" [level=3] [ref=f31e225]
      - list [ref=f31e226]:
        - listitem [ref=f31e227]: Commissions are not necessarily first-come-first-serve.
        - list [ref=f31e228]:
          - listitem [ref=f31e229]:
            - text: New commissions will typically be added to the end of my current
            - link "queue" [ref=f31e230] [cursor=pointer]:
              - /url: https://trello.com/b/S1Esq1jw/
            - text: if no prior deadline is requested.
          - listitem [ref=f31e231]:
            - text: Requested deadlines that conflict with my prior queue may be subject to a
            - mark [ref=f31e232]: rush service fee
            - text: . Please
            - link "contact" [ref=f31e233] [cursor=pointer]:
              - /url: contact.html
            - text: for details.
        - listitem [ref=f31e234]: Turnaround time will vary depending on complexity and other factors.
        - list [ref=f31e235]:
          - listitem [ref=f31e236]: Typical turnaround time is 10-20 days from the time work begins.
        - listitem [ref=f31e237]: "The rigging process typically follows these milestones:"
        - list [ref=f31e238]:
          - listitem [ref=f31e239]: Face rigging, such as mouth, eyes, and eyebrows,
          - listitem [ref=f31e240]: Head angles, without hair,
          - listitem [ref=f31e241]: Hair angles, without physics,
          - listitem [ref=f31e242]: Body turns, including arms & legs, and
          - listitem [ref=f31e243]: Hair, clothing, and accessory physics.
          - listitem [ref=f31e244]: Toggles, animations, and other major add-ons.
        - listitem [ref=f31e245]: Updates and opportunities for feedback will typically be provided at each of the aforementioned milestones.
        - listitem [ref=f31e246]: Deliverables include the rigged model itself with VTube Studio settings, a readme, and VBridger + Vitamins settings files if applicable.
        - listitem [ref=f31e247]:
          - text: Deliverables
          - mark [ref=f31e248]: do not, by default, include the .cmo3
          - text: project file.
        - list [ref=f31e249]:
          - listitem [ref=f31e250]:
            - text: Projects requiring delivery of the .cmo3 file are considered work for non-individuals as described in the
            - link "Terms of Service" [ref=f31e251] [cursor=pointer]:
              - /url: tos.html#commercial
            - text: .
          - listitem [ref=f31e252]:
            - text: For details, please
            - link "contact" [ref=f31e253] [cursor=pointer]:
              - /url: contact.html
            - text: .
        - listitem [ref=f31e254]: Minor revisions are free.
        - listitem [ref=f31e255]: Major revisions may incur fees depending on complexity.
        - listitem [ref=f31e256]: Revisions due to rigging errors are always free.
        - listitem [ref=f31e257]: I reserve the right to display the finished product on my page(s). Credit will be provided where possible.
        - list [ref=f31e258]:
          - listitem [ref=f31e259]: The finished product will not be officially displayed until it has begun full use by the client.
