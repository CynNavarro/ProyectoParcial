      - heading [level=2] [ref=f31e87]:
        - mark [ref=f31e88]: Standard Features
      - paragraph [ref=f31e89]: All rigs include standard facial rigging, high-range head angles, extensive body movements, advanced hair and clothing physics, and 5 simple toggles!
      - paragraph [ref=f31e90]: Body rigging also includes stepping side-to-side, shoulders and hips, individual finger movements, as well as leaning in and out, and more!
      - paragraph [ref=f31e91]: All movements are all controlled and augmented by physics for more weighty, bouncy, and realistic movements compared to conventional tracking.
