        - generic [ref=f32e50]:
          - heading "Terms & Conditions" [level=6] [ref=f32e54]
          - generic [ref=f32e59]:
            - paragraph [ref=f32e60]: I can create a Vtuber from start to finish, or if you just want to order one part of the process I can do that too!
            - paragraph [ref=f32e61]: Please allow up to 3 months once initial payment is accepted for the full model to be done, any add-ons may extend this time. I do my best to provide accurate time estimates and will update if those change. If we begin in the Character Design phase this will extend the time needed by 2-4 weeks.
            - paragraph [ref=f32e62]: Prices are subject to change, but once we have agreed on a price that will be honored.
            - paragraph [ref=f32e63]: Prices can vary depending on the complexity of the design, I also offer a more simplified rigging option to lower costs if you are trying to keep your budget low.
            - paragraph [ref=f32e64]: You may use your Vtuber model to stream, make videos, and make promotional material! You may not use the image on merch or resell the image in any way without a commercial license. Please reach out to me if you wish to purchase one.
            - paragraph [ref=f32e65]: I work in the art style I am comfortable with, please don't ask me to try to emulate someone else's art style. I will however provide rigging services on art that is already complete and ready for rigging as long as you have done it yourself or have written permission from the original artist.
            - paragraph [ref=f32e66]: For the Vtuber commissions, I accept payments in parts for each step that of the process. I will not send the finished files until all payments have been made.
            - paragraph [ref=f32e67]: I reserve the right to post the model on social media and my portfolio. I also usually stream some of the process so let me know if that is an issue for you.
            - paragraph [ref=f32e68]:
              - text: Please credit me where appropriate, just a simple note in the about section or social media bio is enough. Feel free to link to my
              - strong [ref=f32e69]:
                - link "twitter" [ref=f32e70] [cursor=pointer]:
                  - /url: https://twitter.com/BeanyCoffee
                - text: ","
                - link "twitch" [ref=f32e71] [cursor=pointer]:
                  - /url: https://www.twitch.tv/beanycoffee
                - text: ","
              - text: or back to this site when giving credit.
            - paragraph [ref=f32e72]: Payments are accepted through PayPal using invoices.
            - paragraph [ref=f32e73]:
              - text: There are
              - emphasis [ref=f32e74]:
                - strong [ref=f32e75]: no refunds
              - text: unless I am unable to complete the commission due to unforeseen circumstances.
