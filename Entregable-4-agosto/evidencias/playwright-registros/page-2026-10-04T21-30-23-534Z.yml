              - paragraph [ref=f32e135]: This option is for those who don't yet have a character design. This option includes thumbnails for very rough designs, refined with a sketch, then the full color painted character in a pose of your choice. Edits (up to 5 free) are allowed throughout the process, but once the sketch is approved there should be no major changes to the design going forward.
