        - generic [ref=f32e466]:
          - heading "FAQ" [level=2] [ref=f32e471]
          - generic [ref=f32e474]:
            - paragraph [ref=f32e475]:
              - strong [ref=f32e476]: What software can I use these files in?
            - paragraph [ref=f32e477]: The program exports the models as .moc3 files so ideally any capture software that works with that file type. I have used both FaceRig and Vtube Studio.
            - paragraph [ref=f32e478]:
              - strong [ref=f32e479]: Will you help me with importing my model?
            - paragraph [ref=f32e480]: Yes as long as you are using either FaceRig or Vtube Studio, those are the only two programs I have any knowledge with. Personally I recommend Vtube Studio, the setup is simple and there are more options available to you.
            - paragraph [ref=f32e481]:
              - strong [ref=f32e482]: My model isn't moving properly, can you fix it?
            - paragraph [ref=f32e483]: Please note that facial capture software is not perfect and can be influenced by such things as lighting in the room. It seems to have trouble tracking downward eye movement and does not usually reach each extreme pose set in the parameters though I do my best to push these appropriately. If you are unhappy with how your model is working, please record footage of the issue and send it to me.
