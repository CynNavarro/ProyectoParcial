              - paragraph [ref=f32e148]: "If you already have a design but would like a full reference sheet for your model this option includes: a front view, a back view, profile view, and up to 3 additional accessories/expressions."
              - paragraph [ref=f32e149]: All art is done with clean sketch lines and flat colors.
